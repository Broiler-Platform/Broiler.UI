name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read
  packages: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
  NuGetPackageSourceCredentials_broiler-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configuration: Release
            pack: true
          - os: ubuntu-latest
            configuration: Release-Linux
            pack: false
          - os: windows-latest
            configuration: Release-Windows
            pack: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Verify one assembly per name
        run: bash ./scripts/check-component-graph.sh
        env:
          CONFIGURATION: ${{ matrix.configuration }}

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.UI.slnx -c "${{ matrix.configuration }}" --nologo "${args[@]}"

      - name: Test
        shell: pwsh
        run: ./eng/run-tests.ps1 -Configuration '${{ matrix.configuration }}'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.configuration }}
          path: test-results/
          if-no-files-found: warn

      - name: Pack and verify every package
        if: matrix.pack
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        if: matrix.pack
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
